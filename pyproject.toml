[project]
name = "aikit"
version = "1.0.0"
description = "Companion code for the book 'Generative AI with Python: Build, Deploy and Govern Intelligent Applications'"
readme = "README.md"
authors = [{ name = "Ronald Allan V. Tomimbang" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "ollama",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "tenacity",
    "rich",
    "jinja2",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
# Chapter 3 and 5: tokenizers and open models
models = ["tiktoken", "transformers", "accelerate", "torch", "sentence-transformers"]
# Chapters 8-9: retrieval
rag = ["sentence-transformers", "chromadb", "rank-bm25", "pypdf", "python-docx"]
# Chapter 11: multimodal
multimodal = ["pillow", "diffusers", "faster-whisper"]
# Chapter 12: services and front ends
api = ["fastapi", "uvicorn[standard]", "sse-starlette", "pyjwt[crypto]", "streamlit", "gradio"]
# Chapter 13: fine-tuning (GPU recommended)
finetune = ["datasets", "peft", "trl", "bitsandbytes"]
# Chapter 15: observability
ops = ["opentelemetry-sdk", "opentelemetry-exporter-otlp", "redis"]
# Chapter 16: PII detection
security = ["presidio-analyzer", "presidio-anonymizer"]
# Chapter 7: Model Context Protocol server
mcp = ["mcp[cli]"]
# Part VI: Raspberry Pi projects (install on the Pi)
pi = ["psutil", "faster-whisper", "piper-tts", "sounddevice", "gpiozero", "fastapi", "uvicorn[standard]", "icalendar"]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel", "scikit-learn", "jiwer", "matplotlib", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aikit"]

[tool.pytest.ini_options]
markers = ["llm: tests that call real models and cost money (run with -m llm)"]

[tool.ruff]
line-length = 110
extend-exclude = ["chapters/*/snippets", "solutions"]
